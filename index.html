<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Coming Soon</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet"
  >
</head>

<body>

  <!-- Main title -->
  <h1 class="heading">Liquid Gradient</h1>

  <!-- Color Adjuster Toggle -->
  <button
    class="toggle-adjuster-btn"
    id="toggleAdjusterBtn"
    type="button"
  >
    Adjust Colors
  </button>

  <!-- Color Adjuster -->
  <div
    class="color-adjuster-panel"
    id="colorAdjusterPanel"
  >

    <div class="color-adjuster-header">
      <h2 class="color-adjuster-title">
        Color Adjuster
      </h2>

      <button
        class="color-adjuster-close"
        id="closeAdjusterBtn"
        type="button"
        aria-label="Close"
      >
        ×
      </button>
    </div>

    <!-- Color 1 -->
    <div class="color-picker-group">
      <div class="color-picker-label">
        <span>Color 1</span>
      </div>

      <div class="color-picker-wrapper">
        <input
          type="color"
          class="color-picker-input"
          id="colorPicker1"
          value="#F15A22"
        >

        <input
          type="text"
          class="color-value-display"
          id="colorValue1"
          value="#F15A22"
          readonly
        >

        <button
          class="copy-btn"
          data-copy="1"
          type="button"
        >
          Copy
        </button>
      </div>
    </div>

    <!-- Color 2 -->
    <div class="color-picker-group">
      <div class="color-picker-label">
        <span>Color 2</span>
      </div>

      <div class="color-picker-wrapper">
        <input
          type="color"
          class="color-picker-input"
          id="colorPicker2"
          value="#0A0E27"
        >

        <input
          type="text"
          class="color-value-display"
          id="colorValue2"
          value="#0A0E27"
          readonly
        >

        <button
          class="copy-btn"
          data-copy="2"
          type="button"
        >
          Copy
        </button>
      </div>
    </div>

    <!-- Color 3 -->
    <div class="color-picker-group">
      <div class="color-picker-label">
        <span>Color 3</span>
      </div>

      <div class="color-picker-wrapper">
        <input
          type="color"
          class="color-picker-input"
          id="colorPicker3"
          value="#40E0D0"
        >

        <input
          type="text"
          class="color-value-display"
          id="colorValue3"
          value="#40E0D0"
          readonly
        >

        <button
          class="copy-btn"
          data-copy="3"
          type="button"
        >
          Copy
        </button>
      </div>
    </div>

    <!-- Color 4 -->
    <div class="color-picker-group">
      <div class="color-picker-label">
        <span>Color 4</span>
      </div>

      <div class="color-picker-wrapper">
        <input
          type="color"
          class="color-picker-input"
          id="colorPicker4"
          value="#F15A22"
        >

        <input
          type="text"
          class="color-value-display"
          id="colorValue4"
          value="#F15A22"
          readonly
        >

        <button
          class="copy-btn"
          data-copy="4"
          type="button"
        >
          Copy
        </button>
      </div>
    </div>

    <!-- Color 5 -->
    <div class="color-picker-group">
      <div class="color-picker-label">
        <span>Color 5</span>
      </div>

      <div class="color-picker-wrapper">
        <input
          type="color"
          class="color-picker-input"
          id="colorPicker5"
          value="#0A0E27"
        >

        <input
          type="text"
          class="color-value-display"
          id="colorValue5"
          value="#0A0E27"
          readonly
        >

        <button
          class="copy-btn"
          data-copy="5"
          type="button"
        >
          Copy
        </button>
      </div>
    </div>

    <!-- Color 6 -->
    <div class="color-picker-group">
      <div class="color-picker-label">
        <span>Color 6</span>
      </div>

      <div class="color-picker-wrapper">
        <input
          type="color"
          class="color-picker-input"
          id="colorPicker6"
          value="#40E0D0"
        >

        <input
          type="text"
          class="color-value-display"
          id="colorValue6"
          value="#40E0D0"
          readonly
        >

        <button
          class="copy-btn"
          data-copy="6"
          type="button"
        >
          Copy
        </button>
      </div>
    </div>

    <div class="color-adjuster-actions">
      <button
        class="export-btn"
        id="exportAllBtn"
        type="button"
      >
        Export All Colors
      </button>
    </div>

  </div>

  <!-- Footer -->
  <footer class="footer">
    <span>Coming Soon</span>
  </footer>

  <!-- Custom cursor -->
  <div
    class="custom-cursor"
    id="customCursor"
  ></div>

  <!-- Three.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <!-- App -->
  <script src="script.js"></script>

</body>
</html>
