<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Under Construction</title>

    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #000000;

            display: flex;
            justify-content: center;
            align-items: center;

            overflow: hidden;
        }

        .construction {
            color: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 30px;
            font-weight: normal;
            text-align: center;
        }

        /* iPhone / kleine Bildschirme */
        @media screen and (max-width: 767px) {
            .construction {
                font-size: 12px;
            }
        }

        /* MacBook / iMac / Desktop */
        @media screen and (min-width: 768px) {
            .construction {
                font-size: 22px;
            }
        }
    </style>
</head>

<body>

    <div class="construction">
        under construction
    </div>

</body>
</html>
